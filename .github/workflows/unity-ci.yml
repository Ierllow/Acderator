name: Unity CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Check C# whitespace
        run: dotnet format whitespace --folder --verify-no-changes --include Assets/Acderator
        working-directory: App

      - name: Check C# style
        if: ${{ hashFiles('App/Assembly-CSharp.csproj') != '' }}
        run: dotnet format style Assembly-CSharp.csproj --verify-no-changes --severity warn --include Assets/Acderator --no-restore
        working-directory: App

      - name: Check C# analyzers
        if: ${{ hashFiles('App/Assembly-CSharp.csproj') != '' }}
        run: dotnet format analyzers Assembly-CSharp.csproj --verify-no-changes --severity warn --include Assets/Acderator --no-restore
        working-directory: App

  unity-tests:
    name: Unity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: App/Library
          key: Library-${{ runner.os }}-${{ hashFiles('App/Packages/manifest.json', 'App/Packages/packages-lock.json', 'App/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: App
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts
          if-no-files-found: ignore

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs:
      - lint
      - unity-tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: App/Library
          key: Library-${{ runner.os }}-Android-${{ hashFiles('App/Packages/manifest.json', 'App/Packages/packages-lock.json', 'App/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-Android-
            Library-${{ runner.os }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: App
          targetPlatform: Android

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Acderator-Android
          path: build/Android
