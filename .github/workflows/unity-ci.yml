name: Unity CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Check C# whitespace
        run: dotnet format whitespace --folder --verify-no-changes --include Assets/Acderator
        working-directory: App

      - name: Check C# files have no final newline
        run: |
          failed=0
          while IFS= read -r file; do
            if [ -s "$file" ]; then
              last_byte="$(tail -c 1 "$file" | od -An -t x1 | tr -d ' \n')"
              if [ "$last_byte" = "0a" ] || [ "$last_byte" = "0d" ]; then
                echo "::error file=$file::C# files must not end with a newline."
                failed=1
              fi
            fi
          done < <(git ls-files 'Assets/Acderator' 'Program.cs' | grep '\.cs$')
          exit "$failed"
        working-directory: App

  unity-tests:
    name: Unity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Free disk space
        run: |
          uname -a
          command -v docker || true
          docker --version || true
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: App/Library
          key: Library-${{ runner.os }}-${{ hashFiles('App/Packages/manifest.json', 'App/Packages/packages-lock.json', 'App/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: App
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        if: always()
        with:
          dotnet-version: 8.0.x

      - name: Check C# coding rules
        if: always()
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base_sha" ] || echo "$base_sha" | grep -q '^0*$'; then
            base_sha="HEAD~1"
          fi
          mapfile -t files < <(git -C .. diff --name-only --diff-filter=ACM "$base_sha" HEAD -- 'App/Assets/Acderator/**/*.cs' 'App/Assets/Acderator/*.cs' | grep -v '^App/Assets/Acderator/Scripts/Intense/Master/' | sed 's#^App/##')
          dotnet run --project CodingRuleChecker.csproj -- "${files[@]}"
        working-directory: App

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts
          if-no-files-found: ignore

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs:
      - lint
      - unity-tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          uname -a
          command -v docker || true
          docker --version || true
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: App/Library
          key: Library-${{ runner.os }}-Android-${{ hashFiles('App/Packages/manifest.json', 'App/Packages/packages-lock.json', 'App/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-Android-
            Library-${{ runner.os }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: App
          targetPlatform: Android

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Acderator-Android
          path: build/Android